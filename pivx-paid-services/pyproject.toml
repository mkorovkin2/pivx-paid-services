[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pivx-paid-services"
version = "0.1.0"
description = "Memo-bound shielded PIV payments for agent data services"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pivx-paid-services = "paid_services.__main__:main"
pivx-services-mcp = "paid_services.mcp:main"
pivx-testnet-wallet = "paid_services.testnet_wallet:main"

[tool.setuptools.package-data]
paid_services = ["schema.sql", "static/*"]

[tool.setuptools.packages.find]
include = ["paid_services*"]
